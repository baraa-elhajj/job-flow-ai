name: LinkedIn Lebanon job scraper

on:
  schedule:
    # Every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: linkedin-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkedin_scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linkedin_scraper/requirements.txt

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(python -c 'from importlib.metadata import version; print(version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      # Always run: ensures browsers match the installed playwright package.
      # With a warm cache this is usually quick (skips re-download when versions align).
      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run Lebanon job scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PROXY: ${{ secrets.PROXY }}
          PYTHONPATH: ${{ github.workspace }}/linkedin_scraper
        run: python linkedin_scraper/samples/scrape_from_past_12_lb.py