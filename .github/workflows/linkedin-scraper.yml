name: LinkedIn Lebanon job scraper

on:
  schedule:
    # Every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: linkedin-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkedin_scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linkedin_scraper/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('linkedin_scraper/requirements.txt') }}

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run Lebanon job scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PROXY_DOWNLOAD_URL: ${{ secrets.PROXY_DOWNLOAD_URL }}
          PYTHONPATH: ${{ github.workspace }}/linkedin_scraper
        run: python linkedin_scraper/samples/scrape_from_past_12_lb.py