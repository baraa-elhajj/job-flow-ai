name: LinkedIn Lebanon job scraper

on:
  schedule:
    # Every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: linkedin-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkedin_scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linkedin_scraper/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Lebanon job scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}/linkedin_scraper
        run: python linkedin_scraper/samples/scrape_from_past_12_lb.py